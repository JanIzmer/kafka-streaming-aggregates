[project]
name = "orders-stream"
version = "0.1.0"
description = "Kafka to Postgres streaming aggregates with dedup and late-data handling"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.5",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "typer>=0.15",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "testcontainers>=4.7",
]

[project.scripts]
orders-producer = "orders_stream.producer.cli:app"
orders-processor = "orders_stream.processor.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
packages = ["orders_stream"]
mypy_path = "src"
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = ["integration: needs Kafka and Postgres, skipped by default"]
